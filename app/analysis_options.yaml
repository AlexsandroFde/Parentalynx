include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # O projeto nao usa `dynamic` como atalho de tipagem.
    avoid_dynamic_calls: error
    unawaited_futures: warning
  exclude:
    - build/**
    - android/**
    - lib/core/platform/native_api.g.dart
    - pigeons/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_lambdas
    - use_build_context_synchronously

formatter:
  page_width: 100
