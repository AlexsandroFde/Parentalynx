# Producao: a API fica so na rede interna e o Caddy termina o HTTPS com certificado automatico.
#
# Antes de subir, copie .env.example para .env e preencha DOMAIN e DATA_ENCRYPTION_KEY.
#   docker compose up -d --build
# Em um VPS, deploy/publicar.sh faz isso e o resto (ver docs/08-servidor-vps.md).

# Nome fixo do projeto: os volumes (banco e certificados) nao mudam se a pasta mudar de nome.
name: parentalynx

# Logs com tamanho limitado, para nao encher o disco de um VPS pequeno.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_PATH: /data/parentalynx.db
      # O endereco do cliente vem do cabecalho posto pelo Caddy.
      TRUST_PROXY: "true"
    volumes:
      - api_data:/data
    expose:
      - "8080"
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Sem esta porta liberada o Caddy continua atendendo por HTTP/2.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  api_data:
  caddy_data:
  caddy_config:
